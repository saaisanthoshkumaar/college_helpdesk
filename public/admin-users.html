<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Accounts - Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-theme">
    <div class="admin-layout">
        <aside class="admin-sidebar" id="admin-sidebar">
            <div class="admin-sidebar-header"><div class="logo">HelpDesk Admin<span>Management Portal</span></div></div>
            <nav class="admin-sidebar-nav">
                <a href="/admin.html" class="admin-sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>Overview</a>
                <a href="/admin-information.html" class="admin-sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg>College Information</a>
                <a href="/admin-faqs.html" class="admin-sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg>Manage FAQs</a>
                <a href="/admin-notices.html" class="admin-sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>Manage Notices</a>
                <a href="/admin-users.html" class="admin-sidebar-link active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>Student Accounts</a>
                <a href="/admin-manage-admins.html" class="admin-sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>Manage Admins</a>
            </nav>
            <div class="admin-sidebar-footer"><a href="#" id="admin-logout-btn" class="admin-sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Logout</a></div>
        </aside>
        <main class="admin-main">
            <button class="admin-mobile-toggle" id="admin-mobile-toggle">☰</button>
            <div class="admin-page-header">
                <h1 class="admin-page-title">Student Accounts</h1>
            </div>
            <div class="admin-table-header" style="background:white;border-radius:var(--radius) var(--radius) 0 0;border:1px solid var(--border-color);">
                <input type="text" id="user-search" class="form-control" placeholder="Search by name or College ID..." style="max-width:350px;">
            </div>
            <div class="admin-table-wrapper" style="border-top:none;border-radius:0 0 var(--radius) var(--radius);">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr><th>Name</th><th>College ID</th><th>Email</th><th>Department</th><th>Status</th><th>Registered</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="users-table-body">
                            <tr><td colspan="7" class="text-secondary" style="text-align:center;padding:40px;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>
    <script src="/js/api.js"></script>
    <script src="/js/admin.js"></script>
    <script src="/js/admin-users.js"></script>
</body>
</html>
