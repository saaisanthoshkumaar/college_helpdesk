<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - College Help Desk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <style>
        body { display: flex; min-height: 100vh; align-items: center; justify-content: center; text-align: center; padding: 24px; }
        .not-found-number { font-size: 120px; font-weight: 800; color: #E2E8F0; line-height: 1; margin-bottom: 24px; }
        .not-found-title { font-size: 28px; margin-bottom: 16px; }
        .not-found-desc { color: var(--text-secondary); margin-bottom: 32px; max-width: 400px; }
        .not-found-actions { display: flex; gap: 16px; justify-content: center; }
    </style>
</head>
<body>
    <div>
        <div class="not-found-number">404</div>
        <h1 class="not-found-title">Page Not Found</h1>
        <p class="not-found-desc">The page you're looking for doesn't exist or has been moved.</p>
        <div class="not-found-actions">
            <a href="/" class="btn btn-primary">Go Home</a>
            <a href="/login.html" class="btn btn-outline">Log In</a>
        </div>
    </div>
</body>
</html>
