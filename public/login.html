<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - College Help Desk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <a href="/" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to Home
    </a>

    <div class="auth-container">
        <div class="card auth-card">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Log in to access your Help Desk</p>
            </div>
            
            <form id="login-form" class="auth-form">
                <div id="error-message" class="text-error mb-4" style="display:none; text-align:center; font-size: 14px;"></div>
                
                <div class="form-group">
                    <label for="identifier">Email or College ID</label>
                    <input type="text" id="identifier" class="form-control" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn btn-primary mt-4">Log In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register.html">Register here</a>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
