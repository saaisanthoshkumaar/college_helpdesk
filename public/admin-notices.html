<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Notices - Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-theme">
    <div class="admin-layout">
        <aside class="admin-sidebar" id="admin-sidebar">
            <div class="admin-sidebar-header"><div class="logo">HelpDesk Admin<span>Management Portal</span></div></div>
            <nav class="admin-sidebar-nav">
                <a href="/admin.html" class="admin-sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>Overview</a>
                <a href="/admin-information.html" class="admin-sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>College Information</a>
                <a href="/admin-faqs.html" class="admin-sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>Manage FAQs</a>
                <a href="/admin-notices.html" class="admin-sidebar-link active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>Manage Notices</a>
                <a href="/admin-users.html" class="admin-sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>Student Accounts</a>
                <a href="/admin-manage-admins.html" class="admin-sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>Manage Admins</a>
            </nav>
            <div class="admin-sidebar-footer"><a href="#" id="admin-logout-btn" class="admin-sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Logout</a></div>
        </aside>
        <main class="admin-main">
            <button class="admin-mobile-toggle" id="admin-mobile-toggle">☰</button>
            <div class="admin-page-header">
                <h1 class="admin-page-title">Manage Notices</h1>
                <button class="btn btn-primary" id="add-notice-btn">+ Add Notice</button>
            </div>
            <div class="admin-table-header" style="background:white;border-radius:var(--radius) var(--radius) 0 0;border:1px solid var(--border-color);">
                <input type="text" id="notice-search" class="form-control" placeholder="Search notices..." style="max-width:300px;">
            </div>
            <div class="admin-table-wrapper" style="border-top:none;border-radius:0 0 var(--radius) var(--radius);">
                <div class="table-container">
                    <table>
                        <thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
                        <tbody id="notices-table-body">
                            <tr><td colspan="5" style="text-align:center;padding:40px;" class="text-secondary">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Notice Modal -->
    <div class="modal-overlay" id="notice-modal">
        <div class="modal" style="max-width:600px;">
            <div class="modal-header">
                <h3 id="notice-modal-title">Add Notice</h3>
                <button class="modal-close" id="close-notice-modal">&times;</button>
            </div>
            <form id="notice-form">
                <input type="hidden" id="notice-id">
                <div class="form-group"><label>Title *</label><input type="text" id="notice-title" class="form-control" required></div>
                <div class="form-group"><label>Category *</label>
                    <select id="notice-category" class="form-control" required>
                        <option value="">Select...</option>
                        <option>Examinations</option><option>Events</option><option>Fees</option>
                        <option>General</option><option>Holidays</option><option>Results</option>
                        <option>Administrative</option>
                    </select>
                </div>
                <div class="form-group"><label>Content *</label><textarea id="notice-content" class="form-control" rows="5" required style="resize:vertical;"></textarea></div>
                <div class="form-group"><label>Department</label><input type="text" id="notice-dept" class="form-control" placeholder="e.g. All"></div>
                <div class="form-group" style="flex-direction:row;align-items:center;gap:12px;">
                    <input type="checkbox" id="notice-published" style="width:18px;height:18px;">
                    <label for="notice-published" style="margin-bottom:0;cursor:pointer;">Published</label>
                </div>
                <div style="display:flex;gap:12px;margin-top:24px;">
                    <button type="submit" class="btn btn-primary" style="flex:1;">Save Notice</button>
                    <button type="button" class="btn btn-outline" id="cancel-notice-modal" style="flex:1;">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="/js/api.js"></script>
    <script src="/js/admin.js"></script>
    <script src="/js/admin-notices.js"></script>
</body>
</html>
